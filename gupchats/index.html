<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Gupchats</title>
<link rel="icon" type="image/png" sizes="32x32" href="/gupchats/gupchats-favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/gupchats/gupchats-favicon-48.png">
<link rel="apple-touch-icon" href="/gupchats/gupchats-apple-touch-icon.png">
<style>
:root{--bg:#fff;--surface:#f0f2f5;--text:#050505;--dim:#65676b;--blue:#0866ff;--blue-soft:#e7f0ff;--border:#e4e6eb;--red:#e41e3f;--green:#31a24c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
button{font-family:inherit;cursor:pointer}
.wordmark{font-size:30px;font-weight:800;color:var(--blue);letter-spacing:-1px}
.wordmark.logo{display:block;height:44px;width:auto;margin:0}
.brand{display:flex;align-items:center;gap:8px}
.brand img{height:42px;width:auto;display:block}
.brand span{font-size:26px;font-weight:800;letter-spacing:-.8px;background:linear-gradient(90deg,#b020e8,#2f6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
#login .wordmark.logo{height:auto;width:min(260px,70vw);margin:0 auto 10px}
.h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--text)}
.iconbtn:active{background:var(--surface)}
.search{margin:6px 16px 10px;background:var(--surface);border-radius:24px;padding:11px 16px;display:flex;gap:10px;align-items:center;color:var(--dim)}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;color:var(--text);min-width:0}
main{flex:1;min-height:0;position:relative}
.tab{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-bottom:12px}
.tab.on{display:block}
nav{display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);background:var(--bg)}
nav button{position:relative;border:0;background:none;width:84px;height:44px;border-radius:22px;color:#8a8d91;display:flex;align-items:center;justify-content:center}
nav button.on{background:var(--blue-soft);color:var(--blue)}
.dot{position:absolute;top:5px;right:22px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #fff}
.row{display:flex;align-items:center;gap:12px;padding:9px 16px;cursor:pointer}
.row:active{background:var(--surface)}
.av{width:56px;height:56px;border-radius:50%;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:44px;height:44px;font-size:16px}
.rb{flex:1;min-width:0}
.rn{font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row.unread .rn,.row.unread .rs{font-weight:700;color:var(--text)}
.rt{font-size:12.5px;color:var(--dim);align-self:flex-start;margin-top:6px}
.ub{width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none}
.strip{display:flex;gap:14px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.st{width:70px;flex:none;text-align:center;cursor:pointer}
.st .av{width:64px;height:64px;margin:0 auto}
.st div.n{font-size:12.5px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;padding:6px 16px 10px;overflow-x:auto}
.chip{border:0;background:var(--surface);padding:9px 16px;border-radius:20px;font-size:15px;font-weight:700;color:var(--dim);white-space:nowrap}
.chip.on{background:var(--blue-soft);color:var(--blue)}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:700;font-size:14.5px;background:var(--blue);color:#fff}
.btn.gray{background:var(--surface);color:var(--text)}
.empty{text-align:center;color:var(--dim);padding:48px 28px;font-size:15px;line-height:1.5}
.sec{padding:12px 16px 4px;font-size:15px;color:var(--dim);font-weight:600}
.card{display:flex;align-items:center;gap:14px;padding:12px 16px;font-size:17px;cursor:pointer}
.card .ic{width:36px;height:36px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center}
hr{border:0;border-top:1px solid var(--border);margin:8px 0}
/* chat */
#chat .top{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border)}
#msgs{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:3px;-webkit-overflow-scrolling:touch}
.b{max-width:78%;padding:9px 13px;border-radius:19px;font-size:16px;line-height:1.35;word-wrap:break-word;white-space:pre-wrap}
.b.me{align-self:flex-end;background:var(--blue);color:#fff}
.b.th{align-self:flex-start;background:var(--surface)}
.b.lock{font-style:italic;opacity:.8}
.tm{align-self:center;font-size:12px;color:var(--dim);margin:10px 0 4px}
#composer{display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border)}
#composer textarea{flex:1;resize:none;max-height:110px;border:0;background:var(--surface);border-radius:20px;padding:10px 15px;font-size:16px;font-family:inherit;outline:none;color:var(--text)}
#sendBtn{border:0;background:none;color:var(--blue);font-weight:800;font-size:16px;padding:10px 8px}
#sendBtn:disabled{opacity:.35}
#note{padding:10px 16px;font-size:13px;color:var(--dim);text-align:center;background:var(--surface)}
/* login */
#login{align-items:center;justify-content:center;text-align:center;padding:24px}
#login .wordmark{font-size:44px;margin-bottom:6px}
#login p{color:var(--dim);margin:0 0 28px}
#login .btn{padding:14px 28px;font-size:16px;border-radius:26px;min-width:240px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:99;max-width:86%;text-align:center}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80%;overflow-y:auto}
/* ---- v2: online dot, story ring, media, composer, overlays ---- */
.avw{position:relative;flex:none;display:inline-block;border-radius:50%}
.avw .od{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;background:var(--green);border:2.5px solid #fff}
.top .avw .od,.av.sm+.od{width:11px;height:11px;border-width:2px}
.avw.ring .av{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue)}
.avw.ring.seen .av{box-shadow:0 0 0 2px #fff,0 0 0 4px #c9ccd1}
.st .avw{display:block;width:64px;margin:0 auto}
.avw .plus{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;border:2px solid #fff;font-weight:800;font-size:15px;line-height:18px;text-align:center}
.b.media{padding:4px;background:var(--surface)}
.b.me.media{background:var(--blue)}
.b .mi{display:block;max-width:100%;border-radius:15px;cursor:pointer;background:#ddd}
.b .mph{display:flex;align-items:center;justify-content:center;min-width:150px;min-height:48px;padding:10px;font-size:14px;opacity:.8}
.b audio{display:block;width:230px;max-width:100%;height:40px}
.b .dur{font-size:11.5px;opacity:.75;padding:2px 8px 4px}
.pend{align-self:flex-end;font-size:13px;color:var(--dim);padding:6px 10px}
#composer .iconbtn{flex:none;color:var(--blue)}
#composer .iconbtn:disabled{opacity:.35}
#recBar{display:flex;align-items:center;gap:12px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border)}
#recBar .rd{width:11px;height:11px;border-radius:50%;background:var(--red);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
#recBar .sp{flex:1;font-weight:700}
.inp{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:16px;outline:none;font-family:inherit;margin-top:6px}
.err{color:var(--red);font-size:13.5px;min-height:18px;margin-top:6px}
.sh-t{font-size:18px;font-weight:800;margin-bottom:8px}
.sh-p{color:var(--dim);line-height:1.5;margin:0 0 10px;font-size:14.5px}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.setrow .rb .rn{white-space:normal;font-size:16px}
.setrow .rb .rs{white-space:normal}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:14px;background:#c9ccd1;transition:.15s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--blue)}
.sw input:checked+i:after{left:21px}
.ovl{position:fixed;inset:0;z-index:70;background:#000;color:#fff;display:flex;flex-direction:column}
#sv .sbars{display:flex;gap:4px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 6px;position:relative;z-index:3}
#sv .sbar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
#sv .sbar i{display:block;height:100%;width:0;background:#fff}
#sv .stop{display:flex;align-items:center;gap:10px;padding:4px 12px;position:relative;z-index:3}
#sv .stop .n{font-weight:700;font-size:15px}
#sv .stop .t{font-size:12.5px;opacity:.8}
#sv .svb{border:0;background:none;color:#fff;font-size:20px;width:40px;height:40px}
#svMedia{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#svMedia img,#svMedia video{max-width:100%;max-height:100%;object-fit:contain}
#svCap{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));text-align:center;padding:10px 18px;background:linear-gradient(transparent,rgba(0,0,0,.55));z-index:3;font-size:16px}
#svViews{position:absolute;left:14px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:3;font-size:13.5px;opacity:.9}
#svL,#svR{position:absolute;top:90px;bottom:90px;width:35%;z-index:2}
#svL{left:0}#svR{right:0}
#sc{background:#000}
#sc .scimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#sc img,#sc video{max-width:100%;max-height:100%;object-fit:contain}
#sc .scbar{padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
#sc textarea{border:0;border-radius:14px;padding:11px 14px;font-size:16px;font-family:inherit;resize:none;outline:none}
#iv img{max-width:100%;max-height:100%;margin:auto;object-fit:contain}
</style>
</head>
<body>

<div id="login" class="screen hidden">
  <img class="wordmark logo" src="/gupchats/gupchats-logo.png" alt="GupChats">
  <p>Chat with your Gupzy friends — private and encrypted.</p>
  <button class="btn" id="loginBtn">Continue with Google</button>
  <div id="loginErr" style="color:var(--red);margin-top:16px;font-size:14px"></div>
</div>

<div id="nochannel" class="screen hidden" style="align-items:center;justify-content:center;text-align:center;padding:28px">
  <div class="h1" style="font-size:22px;margin-bottom:10px">Create your Gupzy channel first</div>
  <p style="color:var(--dim);margin:0 0 24px">Gupchats uses your Gupzy profile. Open Gupzy once, create your channel, then come back here.</p>
  <button class="btn gray" id="ncOut">Sign out</button>
</div>

<div id="app" class="screen hidden">
  <main>
    <section id="tChats" class="tab on">
      <div class="hdr"><div class="brand"><img src="/gupchats/gupchats-emblem.png" alt=""><span>GupChats</span></div>
        <button class="iconbtn" id="composeBtn" aria-label="New message"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button></div>
      <div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" placeholder="Search chats or friends" autocomplete="off"></div>
      <div class="strip" id="strip"></div>
      <div id="chatList"></div>
    </section>
    <section id="tPeople" class="tab">
      <div class="hdr"><div class="h1">People</div></div>
      <div class="chips"><button class="chip on" id="chF">Friends</button><button class="chip" id="chR">Friend requests</button></div>
      <div id="peopleList"></div>
    </section>
    <section id="tNotifs" class="tab">
      <div class="hdr"><div class="h1">Notifications</div></div>
      <div id="notifList"></div>
    </section>
    <section id="tMenu" class="tab">
      <div class="hdr"><div class="h1">Menu</div></div>
      <div id="menuBox"></div>
    </section>
  </main>
  <nav>
    <button id="n0" class="on" aria-label="Chats"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.1 2 11.2c0 2.9 1.4 5.4 3.7 7.1V22l3.4-1.9c.9.3 1.9.4 2.9.4 5.5 0 10-4.1 10-9.2S17.5 2 12 2z"/></svg><span class="dot hidden" id="d0"></span></button>
    <button id="n1" aria-label="People"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 19c0-3.3 2.9-5.4 6.5-5.4s6.5 2.1 6.5 5.4z"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 13.8c3 0 5 1.7 5 4.4h-4.2c0-1.7-.5-3.2-1.5-4.2.2-.1.5-.2.7-.2z"/></svg><span class="dot hidden" id="d1"></span></button>
    <button id="n2" aria-label="Notifications"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2.3 2.3 0 0 0 2.3-2.3H9.7A2.3 2.3 0 0 0 12 22zm7-6.3V11a7 7 0 0 0-5.5-6.8V3.5a1.5 1.5 0 0 0-3 0v.7A7 7 0 0 0 5 11v4.7l-2 2v1h18v-1z"/></svg><span class="dot hidden" id="d2"></span></button>
    <button id="n3" aria-label="Menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  </nav>
</div>

<div id="chat" class="screen hidden">
  <div class="top">
    <button class="iconbtn" id="cBack" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div id="cAv"></div><div class="rb"><div class="rn" id="cName" style="font-weight:700"></div><div class="rs" id="cSub">🔒 End-to-end encrypted</div></div>
  </div>
  <div id="msgs"></div>
  <div id="note" class="hidden"></div>
  <div id="composer">
    <button class="iconbtn" id="attBtn" aria-label="Send photo" disabled><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg></button>
    <textarea id="mIn" rows="1" placeholder="Message"></textarea>
    <button class="iconbtn" id="micBtn" aria-label="Voice message" disabled><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="sendBtn" class="hidden" disabled>Send</button>
  </div>
  <div id="recBar" class="hidden"><span class="rd"></span><span class="sp" id="recT">0:00</span><button class="btn gray" id="recCancel">Cancel</button><button class="btn" id="recSend">Send</button></div>
</div>

<input type="file" id="fileIn" accept="image/*" class="hidden">
<input type="file" id="fileStory" accept="image/*,video/*" class="hidden">

<div id="sv" class="ovl hidden">
  <div class="sbars" id="svBars"></div>
  <div class="stop"><div id="svAv"></div><div style="min-width:0"><div class="n" id="svName"></div><div class="t" id="svTime"></div></div><span style="flex:1"></span><button class="svb hidden" id="svDel" aria-label="Delete story">🗑</button><button class="svb" id="svX" aria-label="Close">✕</button></div>
  <div id="svMedia"></div><div id="svL"></div><div id="svR"></div>
  <div id="svCap" class="hidden"></div><div id="svViews"></div>
</div>

<div id="sc" class="ovl hidden">
  <div class="stop" style="display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 6px"><button class="svb" id="scX" style="border:0;background:none;color:#fff;font-size:20px;width:40px;height:40px">✕</button><div style="font-weight:700">New story</div></div>
  <div class="scimg"><img id="scImg" alt=""><video id="scVid" class="hidden" playsinline loop controls style="max-width:100%;max-height:100%"></video></div>
  <div class="scbar"><textarea id="scCap" rows="1" maxlength="120" placeholder="Add a caption…"></textarea><div id="scMsg" style="font-size:13px;min-height:16px"></div><button class="btn" id="scShare" style="padding:13px;font-size:16px;border-radius:24px">Share to your story</button></div>
</div>

<div id="iv" class="ovl hidden" style="z-index:75"></div>

<div id="picker" class="screen hidden" style="z-index:40">
  <div class="top" style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border)">
    <button class="iconbtn" id="pkBack"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div style="font-size:18px;font-weight:800">New message</div></div>
  <div class="search"><input id="pkQ" placeholder="Search friends" autocomplete="off" style="width:100%"></div>
  <div id="pkList" style="flex:1;overflow-y:auto"></div>
</div>

<div id="toast" class="hidden"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" crossorigin="anonymous"></script>

function av(logo,name,cls){ var inner = /^https?:\/\//.test(logo||'') ? '<img src="'+esc(logo)+'" alt="">' : esc(initials(name)); var bg = /^https?:\/\//.test(logo||'') ? 'transparent' : color(name); return '<div class="av '+(cls||'')+'" style="background:'+bg+'">'+inner+'</div>'; }

function ms(t){ return (t && t.toMillis) ? t.toMillis() : (typeof t==='number'?t:0); }

function fmtTime(t){
  var m=ms(t) || Date.now(), d=new Date(m), n=new Date();
  if(d.toDateString()===n.toDateString()) return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  var days=(n-d)/86400000;
  if(days<6) return d.toLocaleDateString([], {weekday:'short'});
  return d.toLocaleDateString([], {month:'short',day:'numeric'});
}

/* ---------------- E2E (own key per account; can be backed up with a password) ---------------- */
function b64(u8){ var s=''; u8.forEach(function(b){ s+=String.fromCharCode(b); }); return btoa(s); }
function unb64(t){ return Uint8Array.from(atob(t), function(c){ return c.charCodeAt(0); }); }
function unb64u(t){ t=String(t).replace(/-/g,'+').replace(/_/g,'/'); while(t.length%4) t+='='; return unb64(t); }
var idbP=null;
function idb(){ if(idbP) return idbP; idbP=new Promise(function(res,rej){ var r=indexedDB.open('gupchats-e2ee',1); r.onupgradeneeded=function(){ r.result.createObjectStore('k'); }; r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ idbP=null; rej(r.error); }; }); return idbP; }
function idbGet(k){ return idb().then(function(d){ return new Promise(function(res,rej){ var q=d.transaction('k').objectStore('k').get(k); q.onsuccess=function(){ res(q.result); }; q.onerror=function(){ rej(q.error); }; }); }); }
function idbSet(k,v){ return idb().then(function(d){ return new Promise(function(res,rej){ var q=d.transaction('k','readwrite').objectStore('k').put(v,k); q.onsuccess=function(){ res(); }; q.onerror=function(){ rej(q.error); }; }); }); }
var myKP=null, ppCache=new Map(), skCache=new Map(), backupState='unknown';

async function genKey(){
  /* extractable on purpose: that is what makes the password backup (and so multi-device / reinstall) possible */
  var kp = await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'}, true, ['deriveBits']);
  var rec = { priv: kp.privateKey, pub: b64(new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey))), ext: true };
  await idbSet('k_'+me.uid, rec); skCache.clear();
  return rec;
}
async function publishPub(rec){
  var ref = db.collection('gcKeys').doc(me.uid), cp=null;
  try{ var d=await ref.get(); cp = d.exists ? d.data().pub : null; }catch(e){}
  if(cp !== rec.pub) await ref.set({ uid: me.uid, pub: rec.pub, updatedAt: FV.serverTimestamp() });
}
async function pwKey(pw, salt, iter){
  var base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function makeBackup(pw){
  var iter=310000, salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  var jwk = await crypto.subtle.exportKey('jwk', myKP.priv);
  var k = await pwKey(pw, salt, iter);
  var ct = await crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, k, te.encode(JSON.stringify(jwk)));
  await db.collection('gcKeyBackups').doc(me.uid).set({ v:1, iter:iter, salt:b64(salt), iv:b64(iv), ct:b64(new Uint8Array(ct)), pub:myKP.pub, updatedAt:FV.serverTimestamp() });
  backupState='on';
}
async function openBackup(bk, pw){
  var k = await pwKey(pw, unb64(bk.salt), bk.iter);
  var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(bk.iv)}, k, unb64(bk.ct));   /* throws on a wrong password */
  var jwk = JSON.parse(td.decode(pt));
  var priv = await crypto.subtle.importKey('jwk', jwk, {name:'ECDH',namedCurve:'P-256'}, true, ['deriveBits']);
  var x=unb64u(jwk.x), y=unb64u(jwk.y), raw=new Uint8Array(1+x.length+y.length); raw[0]=4; raw.set(x,1); raw.set(y,1+x.length);
  if(b64(raw) !== bk.pub) throw new Error('mismatch');
  return { priv: priv, pub: bk.pub, ext: true };
}
function sheet(html){ var bg=document.createElement('div'); bg.className='sheetbg'; bg.innerHTML='<div class="sheet">'+html+'</div>'; document.body.appendChild(bg); return bg; }
/* new phone / reinstall: ask for the backup password */
function restoreFlow(bk){
  return new Promise(function(resolve){
    var bg=sheet('<div class="sh-t">Restore your chats</div><p class="sh-p">You have a chat backup. Enter your backup password to read your old messages on this phone.</p><input id="rsPw" type="password" class="inp" placeholder="Backup password" autocomplete="off"><div class="err" id="rsErr"></div><button class="btn" id="rsGo" style="width:100%;padding:13px;margin-top:8px">Restore</button><button class="btn gray" id="rsNew" style="width:100%;padding:13px;margin-top:8px">Forgot password – start fresh</button>');
    var go=bg.querySelector('#rsGo'), err=bg.querySelector('#rsErr');
    go.onclick=async function(){
      var pw=bg.querySelector('#rsPw').value; if(!pw){ err.textContent='Enter your password'; return; }
      go.disabled=true; err.textContent='Checking…';
      try{ var rec=await openBackup(bk,pw); await idbSet('k_'+me.uid, rec); skCache.clear(); bg.remove(); resolve(rec); }
      catch(e){ go.disabled=false; err.textContent='Wrong password. Try again.'; }
    };
    bg.querySelector('#rsNew').onclick=function(){
      ask('Start fresh?','You will get a new encryption key. Your old messages will stay unreadable (for you and for your friends\u2019 older history with you).','Start fresh',true).then(function(ok){ if(ok){ bg.remove(); resolve(null); } });
    };
  });
}
/* set up / change the backup password */
async function backupSheet(first){
  if(!myKP) return;
  if(!myKP.ext){
    var ok=await ask('Reset encryption key?','This phone uses an older key that cannot be backed up. To turn on backup, a new key is needed: your existing chat history will become unreadable (for you and your friends).','Reset & continue',true);
    if(!ok) return;
    try{ myKP=await genKey(); await publishPub(myKP); ppCache.clear(); backupState='off'; }catch(e){ toast('Could not reset the key'); return; }
  }
  var bg=sheet('<div class="sh-t">'+(first?'Protect your chats':'Chat backup password')+'</div><p class="sh-p">Your messages are end-to-end encrypted. Create a backup password so you can read them again on a new phone or after reinstalling. We never see this password \u2013 if you forget it, the backup cannot be recovered.</p><input id="bpA" type="password" class="inp" placeholder="Backup password (min 8 characters)" autocomplete="off"><input id="bpB" type="password" class="inp" placeholder="Repeat password" autocomplete="off"><div class="err" id="bpE"></div><button class="btn" id="bpGo" style="width:100%;padding:13px;margin-top:8px">Save backup</button><button class="btn gray" id="bpNo" style="width:100%;padding:13px;margin-top:8px">'+(first?'Skip for now':'Cancel')+'</button>');
  var e=bg.querySelector('#bpE'), go=bg.querySelector('#bpGo');
  bg.querySelector('#bpNo').onclick=function(){ bg.remove(); };
  go.onclick=async function(){
    var a=bg.querySelector('#bpA').value, b=bg.querySelector('#bpB').value;
    if(a.length<8){ e.textContent='Use at least 8 characters.'; return; }
    if(a!==b){ e.textContent='Passwords do not match.'; return; }
    go.disabled=true; e.textContent='Saving…';
    try{ await makeBackup(a); bg.remove(); toast('Backup saved \u2713'); }
    catch(err){ go.disabled=false; e.textContent='Could not save: '+(err&&err.message||err); }
  };
}
async function initKeys(){
  var rec = await idbGet('k_'+me.uid), bk=null;
  try{ var d=await db.collection('gcKeyBackups').doc(me.uid).get(); bk=d.exists?d.data():null; }catch(e){}
  if(rec && rec.priv){
    myKP=rec; await publishPub(rec);
    backupState = (bk && bk.pub===rec.pub) ? 'on' : 'off';
    return;
  }
  /* no key on this phone */
  if(bk){
    var r=await restoreFlow(bk);
    if(r){ myKP=r; await publishPub(r); backupState='on'; toast('Chats restored \u2713'); return; }
  }
  myKP=await genKey(); await publishPub(myKP); backupState='off';
  setTimeout(function(){ backupSheet(true); }, 700);
}
async function peerPub(uid){
  var c=ppCache.get(uid); if(c && Date.now()-c.t<120000) return c.p;
  var d=await db.collection('gcKeys').doc(uid).get();
  var p = d.exists ? d.data().pub : null;
  ppCache.set(uid,{p:p,t:Date.now()}); return p;
}
async function sharedKey(peerUid){
  var pub=await peerPub(peerUid); if(!pub) throw new Error('nokey');
  var ck=peerUid+':'+pub; if(skCache.has(ck)) return skCache.get(ck);
  var pk=await crypto.subtle.importKey('raw', unb64(pub), {name:'ECDH',namedCurve:'P-256'}, false, []);
  var bits=await crypto.subtle.deriveBits({name:'ECDH',public:pk}, myKP.priv, 256);
  var hk=await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
  var aes=await crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:te.encode(dmId(me.uid,peerUid)),info:te.encode('gupchats-v1')}, hk, {name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
  skCache.set(ck,aes); return aes;
}
/* message payload = {t:text, m:media?} (old messages are just {t}) */
async function encPayload(peerUid, obj){
  var key=await sharedKey(peerUid), iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv}, key, te.encode(JSON.stringify(obj)));
  return { iv:b64(iv), ct:b64(new Uint8Array(ct)) };
}
async function decPayload(peerUid, iv, ct){
  var key=await sharedKey(peerUid);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)}, key, unb64(ct));
  var o=JSON.parse(td.decode(pt)); if(typeof o.t!=='string') o.t='';
  return o;
}
function previewOf(o){ return o.t ? o.t : (o.m ? (o.m.ty==='img'?'\uD83D\uDCF7 Photo':'\uD83C\uDFA4 Voice message') : ''); }

/* ---------------- media: encrypted on the phone, hosted on Cloudinary (same as Gupzy) ---------------- */
function uploadCloud(blob, resType, filename, onProg){
  return new Promise(function(res,rej){
    var fd=new FormData(); fd.append('file', blob, filename); fd.append('upload_preset', PRESET);
    var x=new XMLHttpRequest(); x.open('POST','https://api.cloudinary.com/v1_1/'+CLOUD+'/'+resType+'/upload'); x.timeout=300000;
    if(onProg) x.upload.onprogress=function(e){ if(e.lengthComputable) onProg(e.loaded/e.total); };
    x.onload=function(){ if(x.status>=200&&x.status<300){ try{ res(JSON.parse(x.responseText).secure_url); }catch(e){ rej(new Error('bad reply')); } } else { var m='Upload failed ('+x.status+')'; try{ m=JSON.parse(x.responseText).error.message; }catch(e){} rej(new Error(m)); } };
    x.onerror=function(){ rej(new Error('Network error')); }; x.ontimeout=function(){ rej(new Error('Upload timed out')); };
    x.send(fd);
  });
}
async function compressImage(file,max,q){
  var bmp; try{ bmp=await createImageBitmap(file); }catch(e){ bmp=await new Promise(function(res,rej){ var im=new Image(); im.onload=function(){ res(im); }; im.onerror=rej; im.src=URL.createObjectURL(file); }); }
  var w=bmp.width||bmp.naturalWidth, h=bmp.height||bmp.naturalHeight, sc=Math.min(1,max/Math.max(w,h)), cw=Math.max(1,Math.round(w*sc)), ch=Math.max(1,Math.round(h*sc));
  var cv=document.createElement('canvas'); cv.width=cw; cv.height=ch; cv.getContext('2d').drawImage(bmp,0,0,cw,ch);
  var blob=await new Promise(function(res){ cv.toBlob(res,'image/jpeg',q); }); if(!blob) throw new Error('compress failed');
  return { blob:blob, w:cw, h:ch };
}
async function encBlob(blob){
  var raw=crypto.getRandomValues(new Uint8Array(32)), iv=crypto.getRandomValues(new Uint8Array(12));
  var key=await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv}, key, await blob.arrayBuffer());
  return { data:new Blob([ct],{type:'application/octet-stream'}), k:b64(raw), i:b64(iv) };
}
var mediaCache=new Map(), mediaUrls=new Map();
function loadMedia(m){
  if(!safeUrl(m.u)) return Promise.reject(new Error('bad url'));
  var c=mediaCache.get(m.u); if(c) return c;
  var p=fetch(m.u).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.arrayBuffer(); }).then(async function(buf){
    var key=await crypto.subtle.importKey('raw', unb64(m.k), 'AES-GCM', false, ['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(m.i)}, key, buf);
    var bu=URL.createObjectURL(new Blob([pt],{type:m.mt||'application/octet-stream'})); mediaUrls.set(m.u,bu); return bu;
  });
  mediaCache.set(m.u,p); p.catch(function(){ mediaCache.delete(m.u); });
  return p;
}

var presMap=new Map(), presUnsubs=[], presKey='', presTimer=null, uiTimer=null, appVis=true, presHidden=false, presThrottle=null;
function isOnline(uid){ if(presHidden) return false; var p=presMap.get(uid); return !!(p && p.online && !p.hidden && Date.now()-p.at<150000); }
function beat(online){

const MAX_VIDEO_UPLOAD_BYTES = 100 * 1024 * 1024;
/* ---- video compression (copied from Gupzy so story videos are compressed the same way) ---- */
function compressVideoFile(file, onProgress, opts){
  opts = opts || {};
  return new Promise((resolve, reject)=>{
    if(typeof MediaRecorder === 'undefined' || !HTMLCanvasElement.prototype.captureStream){
      reject(new Error('This browser cannot compress video')); return;
    }
    const video = document.createElement('video');
    video.playsInline = true; video.muted = true;
    const objUrl = URL.createObjectURL(file);
    let settled = false, failed = null, recorder = null, rafId = 0, wd = 0;
    const cleanup = ()=>{ clearInterval(wd); cancelAnimationFrame(rafId); try{ URL.revokeObjectURL(objUrl); }catch(e){} try{ video.pause(); }catch(e){} };
    const finish = (fn, val)=>{ if(settled) return; settled = true; cleanup(); fn(val); };
    const fail = err=>{
      if(settled) return;
      failed = failed || err || new Error('Compression failed');
      if(recorder && recorder.state !== 'inactive'){ try{ recorder.stop(); return; }catch(e){} }
      finish(reject, failed);
    };
    video.src = objUrl;
    video.addEventListener('error', ()=> fail(new Error('Could not read video for compression')));

    video.addEventListener('loadedmetadata', async ()=>{
      try{
        let w = video.videoWidth || 1280, h = video.videoHeight || 720;
        if(opts.w && opts.h){ w = opts.w; h = opts.h; }
        else{
          const maxDim = 1280;
          if(Math.max(w,h) > maxDim){
            const scale = maxDim / Math.max(w,h);
            w = Math.round((w*scale)/2)*2; h = Math.round((h*scale)/2)*2;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');

        let audioTracks = [];
        try{
          const capture = video.captureStream ? video.captureStream() : (video.mozCaptureStream ? video.mozCaptureStream() : null);
          if(capture) audioTracks = capture.getAudioTracks();
        }catch(e){}

        const canvasStream = canvas.captureStream(opts.fps || 30);
        const combined = new MediaStream([...canvasStream.getVideoTracks(), ...audioTracks]);

        const duration = isFinite(video.duration) && video.duration > 0 ? video.duration : 45;
        let videoBitsPerSecond = opts.videoBps;
        if(!videoBitsPerSecond){
          const targetBytes = 80 * 1024 * 1024; /* thoda margin rakha hai 100MB limit se neeche */
          videoBitsPerSecond = Math.max(600000, Math.floor((targetBytes * 8) / duration));
        }

        let mimeType = 'video/webm;codecs=vp9,opus';
        if(!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm;codecs=vp8,opus';
        if(!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

        const rOpts = { mimeType, videoBitsPerSecond };
        if(opts.audioBps) rOpts.audioBitsPerSecond = opts.audioBps;
        recorder = new MediaRecorder(combined, rOpts);
        const chunks = [];
        recorder.ondataavailable = e=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
        recorder.onstop = ()=>{
          if(failed) finish(reject, failed);
          else finish(resolve, new Blob(chunks, { type:'video/webm' }));
        };
        recorder.onerror = e=> fail(e.error || new Error('Compression failed'));

        function drawFrame(){
          if(settled || video.paused || video.ended) return;
          ctx.drawImage(video, 0, 0, w, h);
          if(onProgress && duration) onProgress(Math.min(99, Math.round((video.currentTime/duration)*100)));
          rafId = requestAnimationFrame(drawFrame);
        }
        video.addEventListener('playing', ()=>{ cancelAnimationFrame(rafId); drawFrame(); });
        video.addEventListener('ended', ()=>{ cancelAnimationFrame(rafId); if(recorder && recorder.state !== 'inactive') recorder.stop(); });

        /* watchdog: if the video gets paused (app switched away etc.) resume it; if it makes no progress for 20 s give up (caller falls back to the original file) */
        let lastT = -1, stall = 0;
        wd = setInterval(()=>{
          if(settled || video.ended) return;
          if(video.paused) video.play().catch(()=>{});
          if(Math.abs(video.currentTime - lastT) < 0.01){ if(++stall >= 20) fail(new Error('Compression stalled')); }
          else{ stall = 0; lastT = video.currentTime; }
        }, 1000);

        await video.play();
        recorder.start();
      }catch(err){ fail(err); }
    });
  });
}

/* ================================================================
   SMART VIDEO COMPRESSION — saves Cloudinary storage (GB)
   Used for: normal uploads, reels, stories, posts and CHAT videos.
   - shrinks resolution (never above what the player shows anyway) and re-encodes at a low bitrate (VP9 webm)
   - skips videos that are already small (re-encoding would only waste time/quality)
   - keeps the ORIGINAL if compressing did not make it clearly smaller, or if compression is not possible
   (real-time re-encode in the browser: 1 min of video ~ 1 min of compressing)
================================================================ */
/* VC-BEGIN */
function vcProfiles(){
  return {
    /* normal videos / reels */
    upload:{ longPortrait:1280, longLandscape:960, fps:24, bpp:0.055, minBps:400000, maxBps:1600000, audioBps:64000, maxCompressSec:1200 },
    /* stories + posts (short clips) */
    short: { longPortrait:1280, longLandscape:960, fps:24, bpp:0.050, minBps:350000, maxBps:1200000, audioBps:48000, maxCompressSec:180 },
    /* chat videos: smallest */
    chat:  { longPortrait:960,  longLandscape:720, fps:24, bpp:0.050, minBps:250000, maxBps:900000,  audioBps:40000, maxCompressSec:600 }
  };
}
function vcTarget(info, prof){
  let w = info.w || 1280, h = info.h || 720;
  const maxLong = (h >= w) ? prof.longPortrait : prof.longLandscape;
  const sc = Math.min(1, maxLong / Math.max(w, h));
  w = Math.max(2, Math.round(w * sc / 2) * 2); h = Math.max(2, Math.round(h * sc / 2) * 2);
  const bps = Math.round(Math.min(prof.maxBps, Math.max(prof.minBps, w * h * prof.fps * prof.bpp)));
  return { w, h, bps, maxLong };
}
async function smartCompressVideo(file, kind, onProgress){
  const prof = vcProfiles()[kind] || vcProfiles().upload;
  const out = { file, ext:'mp4', compressed:false };
  const must = (kind === 'upload' && file.size > MAX_VIDEO_UPLOAD_BYTES);   /* over the upload limit: compression is required */
  const supported = (typeof MediaRecorder !== 'undefined') && !!HTMLCanvasElement.prototype.captureStream;
  if(!supported){ if(must) throw new Error('This browser cannot compress video'); return out; }
  const info = await vcProbe(file);
  if(!info || !isFinite(info.duration) || info.duration <= 0 || !info.w || !info.h){ if(must) throw new Error('Could not read video for compression'); return out; }
  const t = vcTarget(info, prof);
  if(!must){
    if(info.duration > prof.maxCompressSec) return out;                           /* too long to re-encode in real time */
    const curBps = file.size * 8 / info.duration;
    if(curBps <= t.bps * 1.15 && Math.max(info.w, info.h) <= t.maxLong * 1.1) return out;   /* already small */
  }
  try{
    const blob = await compressVideoFile(file, onProgress, { w:t.w, h:t.h, fps:prof.fps, videoBps:t.bps, audioBps:prof.audioBps });
    if(blob && blob.size > 0 && (must || blob.size < file.size * 0.9)) return { file:blob, ext:'webm', compressed:true };
    return out;                                                                    /* not clearly smaller: keep the original */
  }catch(e){
    console.warn('video compression skipped:', e && e.message);
    if(must) throw e;
    return out;
  }
}
/* VC-END */
function vcProbe(file){
  return new Promise(res=>{
    const v = document.createElement('video');
    v.preload = 'metadata'; v.muted = true; v.playsInline = true;
    const u = URL.createObjectURL(file);
    let done = false;
    const fin = r=>{ if(done) return; done = true; clearTimeout(tm); try{ URL.revokeObjectURL(u); }catch(e){} res(r); };
    const tm = setTimeout(()=>fin(null), 8000);
    v.onloadedmetadata = ()=> fin({ duration:v.duration, w:v.videoWidth, h:v.videoHeight });
    v.onerror = ()=> fin(null);
    v.src = u;
  });
}

    var e2=$('chatList').querySelector('[data-pv="'+c.id+'"]'); if(e2) e2.textContent=s;
  }).catch(function(){ var e2=$('chatList').querySelector('[data-pv="'+c.id+'"]'); if(e2) e2.textContent='\uD83D\uDD12 Message'; });
}
function bindRows(root){
  root.querySelectorAll('[data-peer]').forEach(function(el){ el.onclick=function(){ openChat(el.getAttribute('data-peer')); }; });
}
$('q').addEventListener('input', renderChats);

/* ---------------- people / follow graph ---------------- */
function friendRow(f){ return '<div class="row" data-peer="'+esc(f.uid)+'">'+avw(f.uid,f.logo,f.name)+'<div class="rb"><div class="rn">'+esc(f.name)+'</div><div class="rs">'+(isOnline(f.uid)?'Active now · ':'')+(f.handle?'@'+esc(f.handle)+' · ':'')+'Friends</div></div></div>'; }
async function getCh(uid){
  if(chInfo.has(uid) && chInfo.get(uid).name) return chInfo.get(uid);
  try{ var d=await db.collection('channels').doc(uid).get(); var c=d.exists?d.data():{}; var v={name:c.name||'User',logo:c.logoURL||null,handle:c.channelId||''}; chInfo.set(uid,v); return v; }
  catch(e){ return {name:'User',logo:null,handle:''}; }
}
async function loadPeople(){
  try{
    var r=await Promise.all([
      db.collection('subscriptions').where('subscriberId','==',me.uid).limit(500).get(),
      db.collection('subscriptions').where('channelId','==',me.uid).limit(500).get()
    ]);
    followingSet=new Set(); var followingDocs={};
    r[0].docs.forEach(function(d){ var x=d.data(); followingSet.add(x.channelId); followingDocs[x.channelId]=x; });
    followers=r[1].docs.map(function(d){ var x=d.data(); return {uid:x.subscriberId, at:ms(x.joinedAt)}; }).sort(function(a,b){ return b.at-a.at; });
    var fs=new Set(followers.map(function(f){ return f.uid; }));
    var mutualIds=[...followingSet].filter(function(u){ return fs.has(u); });
    var reqIds=followers.filter(function(f){ return !followingSet.has(f.uid); }).map(function(f){ return f.uid; });
    mutualIds.forEach(function(u){ var x=followingDocs[u]; if(x && !chInfo.has(u)) chInfo.set(u,{name:x.channelName||'User',logo:x.channelLogo||null,handle:''}); });
    friends=await Promise.all(mutualIds.slice(0,300).map(async function(u){ var c=await getCh(u); return {uid:u,name:c.name,logo:c.logo,handle:c.handle}; }));
    friends.sort(function(a,b){ return a.name.localeCompare(b.name); });
    requests=await Promise.all(reqIds.slice(0,60).map(async function(u){ var c=await getCh(u); var f=followers.filter(function(z){ return z.uid===u; })[0]; return {uid:u,name:c.name,logo:c.logo,handle:c.handle,at:f?f.at:0}; }));
    $('d1').classList.toggle('hidden', !requests.length);
    var seen=0; try{ seen=+localStorage.getItem('gc_notif_seen_'+me.uid)||0; }catch(e){}
    $('d2').classList.toggle('hidden', !followers.some(function(f){ return f.at>seen; }) || curTab===2);
    renderPeople(); renderChats(); syncPresenceWatch(); loadStories();
  }catch(e){ console.error(e); }
}
function renderPeople(){
  $('chF').classList.toggle('on',peopleMode==='F'); $('chR').classList.toggle('on',peopleMode==='R');
  $('chF').textContent='Friends ('+friends.length+')'; $('chR').textContent='Friend requests'+(requests.length?' ('+requests.length+')':'');
  var box=$('peopleList');
  if(peopleMode==='F'){
    box.innerHTML = friends.length ? friends.map(friendRow).join('') : '<div class="empty">No friends yet.<br>Friends are people who follow you and you follow back. Follow each other in Gupzy to chat here.</div>';
    bindRows(box);
  }else{
    box.innerHTML = requests.length ? requests.map(function(f){ return '<div class="row" style="cursor:default">'+av(f.logo,f.name)+'<div class="rb"><div class="rn">'+esc(f.name)+'</div><div class="rs">Follows you</div></div><button class="btn" data-fb="'+esc(f.uid)+'">Follow back</button></div>'; }).join('') : '<div class="empty">No new requests.</div>';
    bindFollowBack(box);
  }
}
$('chF').onclick=function(){ peopleMode='F'; renderPeople(); };
$('chR').onclick=function(){ peopleMode='R'; renderPeople(); };
function bindFollowBack(root){ root.querySelectorAll('[data-fb]').forEach(function(b){ b.onclick=function(){ followBack(b.getAttribute('data-fb'), b); }; }); }
async function followBack(uid, btn){
  btn.disabled=true;
  try{
    var c=await getCh(uid);
    var ref=db.collection('subscriptions').doc(me.uid+'_'+uid), chRef=db.collection('channels').doc(uid);
    await db.runTransaction(async function(tx){
      var d=await tx.get(ref); if(d.exists) return;
      tx.set(ref,{ subscriberId:me.uid, channelId:uid, channelName:c.name, channelLogo:c.logo||null, joinedAt:FV.serverTimestamp() });
      tx.update(chRef,{ subscriberCount:FV.increment(1) });
    });
    toast('You are now friends with '+c.name);
    loadPeople();
  }catch(e){ btn.disabled=false; toast('Could not follow: '+e.message); }
}

/* ---------------- notifications ---------------- */
async function renderNotifs(){
  var box=$('notifList');
  if(!followers.length){ box.innerHTML='<div class="empty">No notifications yet.</div>'; return; }
  var top=followers.slice(0,40), items=await Promise.all(top.map(async function(f){ var c=await getCh(f.uid); return {uid:f.uid,name:c.name,logo:c.logo,at:f.at}; }));
  box.innerHTML='<div class="sec">Recent</div>'+items.map(function(f){
    var back=!followingSet.has(f.uid);
    return '<div class="row" '+(back?'style="cursor:default"':'data-peer="'+esc(f.uid)+'"')+'>'+av(f.logo,f.name)+'<div class="rb"><div class="rn" style="white-space:normal"><b>'+esc(f.name)+'</b> '+(back?'followed you.':'is now your friend.')+'</div><div class="rs">'+esc(fmtTime(f.at))+'</div></div>'+(back?'<button class="btn" data-fb="'+esc(f.uid)+'">Follow back</button>':'')+'</div>';
  }).join('');
  bindRows(box); bindFollowBack(box);
}

/* ---------------- menu + settings ---------------- */
function renderMenu(){

    '<div class="row" style="cursor:default">'+av(me.logo,me.name)+'<div class="rb"><div class="rn" style="font-weight:700;font-size:18px">'+esc(me.name)+'</div><div class="rs">'+(me.handle?'@'+esc(me.handle):'Gupzy account')+'</div></div></div><hr>'
    +'<div class="card" id="mSet"><div class="ic">⚙️</div>Settings &amp; privacy</div>'

}
function openSettings(){
  var native=!!(window.AndroidPush && window.AndroidPush.request);
  var bg=sheet('<div class="sh-t">Settings &amp; privacy</div>'
    +'<div class="setrow" style="border-top:0"><div class="rb"><div class="rn">Show when I\u2019m online</div><div class="rs">If off, you also won\u2019t see when others are online or their last seen.</div></div><label class="sw"><input type="checkbox" id="stOnl"'+(presHidden?'':' checked')+'><i></i></label></div>'
    +(native?'<div class="setrow"><div class="rb"><div class="rn">Message notifications</div><div class="rs">Get notified when a friend messages you.</div></div><button class="btn gray" id="stNot">Enable</button></div>':'')
    +'<div class="setrow"><div class="rb"><div class="rn">Chat backup</div><div class="rs" id="stBkS">'+(backupState==='on'?'On \u2013 you can restore your messages on a new phone with your backup password.':'Off \u2013 if you uninstall the app or lose this phone, older messages cannot be read again.')+'</div></div><button class="btn gray" id="stBk">'+(backupState==='on'?'Change':'Turn on')+'</button></div>'
    +'<p class="sh-p" style="margin-top:12px">Messages, photos and voice messages are end-to-end encrypted. Only you and your friend can read them.</p>'

  bg.onclick=function(e){ if(e.target===bg) bg.remove(); };

    try{ localStorage.setItem('gc_hide_online_'+me.uid, presHidden?'1':'0'); }catch(e){}
    beat(!presHidden); refreshPresenceUI();
  };
  var nb=bg.querySelector('#stNot'); if(nb) nb.onclick=function(){ try{ window.AndroidPush.request('notif'); }catch(e){} setTimeout(saveNativeToken,1500); };

/* ---------------- picker (new message) ---------------- */
function openPicker(){ $('picker').classList.remove('hidden'); $('pkQ').value=''; renderPicker(); }
function renderPicker(){
  var q=($('pkQ').value||'').toLowerCase(), l=friends.filter(function(f){ return !q || f.name.toLowerCase().indexOf(q)>=0; });
  $('pkList').innerHTML = l.length ? l.map(friendRow).join('') : '<div class="empty">'+(friends.length?'No match.':'You have no friends yet. Follow each other in Gupzy first.')+'</div>';
  $('pkList').querySelectorAll('[data-peer]').forEach(function(el){ el.onclick=function(){ $('picker').classList.add('hidden'); openChat(el.getAttribute('data-peer')); }; });
}
$('composeBtn').onclick=openPicker; $('pkBack').onclick=function(){ $('picker').classList.add('hidden'); }; $('pkQ').addEventListener('input',renderPicker);

/* ---------------- chat screen ---------------- */
async function openChat(peerUid){
  var c=await getCh(peerUid);
  cur={ id:dmId(me.uid,peerUid), peer:{uid:peerUid,name:c.name,logo:c.logo}, canSend:false };
  $('cName').textContent=c.name; updateHeaderSub();
  $('msgs').innerHTML=''; $('mIn').value=''; $('mIn').style.height='auto'; $('note').classList.add('hidden');
  recCancel(true); updateSend();
  $('chat').classList.remove('hidden');
  if(unsubMsgs) unsubMsgs();
  var tok=++msgTok;
  unsubMsgs=db.collection('gcChats').doc(cur.id).collection('messages').orderBy('createdAt','asc').limitToLast(150).onSnapshot(function(snap){
    renderMsgs(snap, tok);
  }, function(e){ if(tok===msgTok) toast('Messages error: '+e.message); });
  markRead();
  try{
    var pub=await peerPub(peerUid);
    if(tok!==msgTok) return;
    if(!pub){ $('note').textContent=c.name+' has not opened Gupchats yet. You can message them once they join.'; $('note').classList.remove('hidden'); cur.canSend=false; }
    else cur.canSend=true;
  }catch(e){ cur.canSend=true; }
  updateSend();
}
function closeChat(){ recCancel(true); if(unsubMsgs){ unsubMsgs(); unsubMsgs=null; } msgTok++; cur=null; $('chat').classList.add('hidden'); }
$('cBack').onclick=closeChat;
function updateSend(){
  var has=!!$('mIn').value.trim(), ok=!!(cur && cur.canSend), rec=!!REC.mr;
  $('sendBtn').classList.toggle('hidden',!has); $('micBtn').classList.toggle('hidden',has);
  $('sendBtn').disabled=!(ok&&has); $('micBtn').disabled=!ok||rec; $('attBtn').disabled=!ok||rec;
}
$('mIn').addEventListener('input',function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,110)+'px'; updateSend(); });
async function markRead(){
  if(!cur) return; var c=chats[cur.id];
  if(c && ((c.unread||{})[me.uid]||0)>0){ try{ await db.collection('gcChats').doc(cur.id).set({unread:{[me.uid]:0}},{merge:true}); }catch(e){} }
}
function mediaInner(media){
  var bu=mediaUrls.get(media.u);
  if(media.ty==='img'){
    var st='width:'+Math.min(240,media.w||240)+'px;max-width:100%;aspect-ratio:'+(media.w||4)+'/'+(media.h||3);
    return bu ? '<img class="mi" src="'+bu+'" data-big="'+bu+'" style="'+st+'" alt="">' : '<div class="mph" data-mu="'+esc(media.u)+'" style="'+st+'">Loading photo…</div>';
  }
  return bu ? '<audio controls preload="metadata" src="'+bu+'"></audio><div class="dur">'+esc(fmtDur(media.d))+'</div>' : '<div class="mph" data-mu="'+esc(media.u)+'">\uD83C\uDFA4 Loading voice message…</div>';
}
function playingAudio(){ var a=$('msgs').querySelectorAll('audio'); for(var i=0;i<a.length;i++){ if(!a[i].paused&&!a[i].ended) return true; } return false; }
function bindBig(box){
  box.querySelectorAll('img[data-big]').forEach(function(im){ im.onclick=function(){ var v=$('iv'); v.innerHTML='<img src="'+im.getAttribute('data-big')+'" alt="">'; v.classList.remove('hidden'); v.onclick=function(){ v.classList.add('hidden'); v.innerHTML=''; }; }; });
}
async function renderMsgs(snap, tok){
  if(playingAudio()){ setTimeout(function(){ if(tok===msgTok) renderMsgs(snap,tok); }, 1500); return; }
  var docs=snap.docs.map(function(d){ return {id:d.id,d:d.data({serverTimestamps:'estimate'})}; });
  var peer=cur && cur.peer; if(!peer) return;
  var out=await Promise.all(docs.map(async function(x){
    var d=x.d, mine=d.from===me.uid, o=null;
    try{ o=await decPayload(peer.uid,d.iv,d.ct); }catch(e){ o=null; }
    return {mine:mine,o:o,at:ms(d.createdAt)};
  }));
  if(tok!==msgTok || !cur) return;
  var html='', lastDay='', box=$('msgs'), toLoad=[];
  var atBottom = box.scrollHeight-box.scrollTop-box.clientHeight < 120;
  out.forEach(function(m){
    var day=new Date(m.at).toDateString();
    if(day!==lastDay){ lastDay=day; html+='<div class="tm">'+esc(fmtTime(m.at))+'</div>'; }
    var side=m.mine?'me':'th';
    if(!m.o){ html+='<div class="b '+side+' lock">\uD83D\uDD12 Can\u2019t read this message</div>'; return; }
    if(m.o.m && (m.o.m.ty==='img'||m.o.m.ty==='aud')){
      html+='<div class="b '+side+' media">'+mediaInner(m.o.m)+'</div>';
      if(!mediaUrls.has(m.o.m.u)) toLoad.push(m.o.m);
    }else{
      html+='<div class="b '+side+'">'+esc(m.o.t)+'</div>';
    }
  });
  box.innerHTML = html || '<div class="empty">Say hi to '+esc(peer.name)+' \uD83D\uDC4B</div>';
  bindBig(box);
  if(atBottom || out.length<=30) box.scrollTop=box.scrollHeight;
  toLoad.forEach(function(m){
    loadMedia(m).then(function(){
      if(tok!==msgTok) return;
      var b2=$('msgs'); b2.querySelectorAll('[data-mu]').forEach(function(el){
        if(el.getAttribute('data-mu')===m.u && el.parentNode){ var pr=el.parentNode; pr.innerHTML=mediaInner(m); bindBig(pr); }
      });
      if(atBottom) b2.scrollTop=b2.scrollHeight;
    }).catch(function(){
      $('msgs').querySelectorAll('[data-mu]').forEach(function(el){ if(el.getAttribute('data-mu')===m.u) el.textContent='\u26A0\uFE0F Couldn\u2019t load'; });
    });
  });
  markRead();
}

/* ---------------- sending ---------------- */
async function sendPayload(obj, peer, id){
  var e=await encPayload(peer.uid,obj);
  var ref=db.collection('gcChats').doc(id);
  await ref.collection('messages').add({ from:me.uid, iv:e.iv, ct:e.ct, v:1, createdAt:FV.serverTimestamp() });
  var info={}; info[me.uid]={name:me.name,logo:me.logo||null}; info[peer.uid]={name:peer.name,logo:peer.logo||null};
  var unread={}; unread[peer.uid]=FV.increment(1);
  await ref.set({ members:[me.uid,peer.uid], info:info, lastIv:e.iv, lastCt:e.ct, lastFrom:me.uid, lastAt:FV.serverTimestamp(), unread:unread },{merge:true});
  pushNotify(id);
}
function sendErr(err,peer){
  if(err && err.message==='nokey') toast(peer.name+' has not opened Gupchats yet');
  else if(err && /permission/i.test(err.message||'')) toast('You can only message friends (follow each other).');
  else toast('Send failed: '+(err&&err.message||err));
}
async function sendText(){
  if(!cur || !cur.canSend) return;
  var text=$('mIn').value.trim(); if(!text) return;
  var id=cur.id, peer=cur.peer;
  $('mIn').value=''; $('mIn').style.height='auto'; updateSend();
  try{ await sendPayload({t:text},peer,id); }
  catch(err){ $('mIn').value=text; updateSend(); sendErr(err,peer); }
}
$('sendBtn').onclick=sendText;
function addPending(txt){ var b=$('msgs'), d=document.createElement('div'); d.className='pend'; d.textContent=txt; b.appendChild(d); b.scrollTop=b.scrollHeight; return d; }
async function sendMedia(ty, blob, extra, peer, id){
  var pend=($('chat').classList.contains('hidden')||!cur||cur.id!==id)?null:addPending(ty==='img'?'\uD83D\uDCF7 Sending photo…':'\uD83C\uDFA4 Sending voice message…');
  try{
    var enc=await encBlob(blob);
    var url=await uploadCloud(enc.data,'raw','gc_'+me.uid.slice(0,6)+'_'+Date.now());
    var m=Object.assign({ty:ty,u:url,k:enc.k,i:enc.i,mt:blob.type||''},extra||{});
    var bu=URL.createObjectURL(blob); mediaUrls.set(url,bu); mediaCache.set(url,Promise.resolve(bu));   /* show my own copy without downloading it again */
    await sendPayload({t:'',m:m},peer,id);
  }catch(err){ sendErr(err,peer); }
  finally{ if(pend&&pend.parentNode) pend.remove(); }
}
/* photo */
$('attBtn').onclick=function(){ if(!cur||!cur.canSend) return; $('fileIn').value=''; $('fileIn').click(); };
$('fileIn').onchange=async function(){
  var f=this.files&&this.files[0]; if(!f||!cur||!cur.canSend) return;
  var id=cur.id, peer=cur.peer;
  try{ var b=await compressImage(f,1280,0.8); await sendMedia('img',b.blob,{w:b.w,h:b.h},peer,id); }
  catch(e){ toast('Could not send that photo'); }
};
/* voice (tap mic to start, Send / Cancel) */
var REC={mr:null};
async function recStart(){
  if(!cur||!cur.canSend||REC.mr) return;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)){ toast('Voice messages are not supported on this device'); return; }
  var stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ toast('Allow the microphone to send voice messages'); return; }
  var types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  var mt=''; for(var i=0;i<types.length;i++){ if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(types[i])){ mt=types[i]; break; } }
  var mr; try{ mr=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream); }catch(e){ stream.getTracks().forEach(function(t){ t.stop(); }); toast('Recording is not available'); return; }
  REC={mr:mr,chunks:[],t0:Date.now(),stream:stream,cancel:false,mt:mr.mimeType||mt||'audio/webm',peer:cur.peer,id:cur.id,iv:0};
  var R=REC;
  mr.ondataavailable=function(ev){ if(ev.data&&ev.data.size) R.chunks.push(ev.data); };
  mr.onstop=function(){ R.stream.getTracks().forEach(function(t){ t.stop(); }); clearInterval(R.iv); if(REC===R) REC={mr:null}; $('recBar').classList.add('hidden'); $('composer').classList.remove('hidden'); updateSend(); finishRec(R); };
  mr.start();
  $('composer').classList.add('hidden'); $('recBar').classList.remove('hidden'); $('recT').textContent='0:00';
  R.iv=setInterval(function(){ var s=(Date.now()-R.t0)/1000; $('recT').textContent=fmtDur(s); if(s>=180) recStop(); },250);
  updateSend();
}
function recStop(){ if(REC.mr && REC.mr.state!=='inactive'){ try{ REC.mr.stop(); }catch(e){} } }
function recCancel(silent){ if(REC.mr){ REC.cancel=true; try{ if(REC.mr.state!=='inactive') REC.mr.stop(); else { REC.stream.getTracks().forEach(function(t){ t.stop(); }); } }catch(e){} } if(silent){ $('recBar').classList.add('hidden'); $('composer').classList.remove('hidden'); } }
function finishRec(R){
  if(R.cancel) return;
  var dur=Math.round((Date.now()-R.t0)/1000);
  if(dur<1 || !R.chunks.length){ toast('Hold on a little longer to record'); return; }
  sendMedia('aud', new Blob(R.chunks,{type:R.mt}), {d:dur}, R.peer, R.id);
}
$('micBtn').onclick=recStart; $('recSend').onclick=recStop; $('recCancel').onclick=function(){ recCancel(false); };

/* Android back button */
window.__gcBack=function(){
  if(!$('iv').classList.contains('hidden')){ $('iv').classList.add('hidden'); $('iv').innerHTML=''; return true; }
  if(!$('sv').classList.contains('hidden')){ svClose(); return true; }
  if(!$('sc').classList.contains('hidden')){ if(!SC.posting) $('sc').classList.add('hidden'); return true; }
  var sh=document.querySelector('.sheetbg'); if(sh){ sh.remove(); return true; }
  if(!$('picker').classList.contains('hidden')){ $('picker').classList.add('hidden'); return true; }
  if(cur){ closeChat(); return true; }
  if(curTab!==0 && me){ setTab(0); return true; }
  return false;
};
})();
